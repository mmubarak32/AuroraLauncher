name: Build APK
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with: { distribution: temurin, java-version: 17 }
      - uses: gradle/actions/setup-gradle@v4
        with: { gradle-version: 8.7 }
      - name: Build debug APK
        run: |
          set +e
          gradle assembleDebug --console=plain > build.log 2>&1
          code=$?
          if [ $code -ne 0 ]; then
            msg=$(grep -E "^e: |What went wrong|Could not|SDK location|licen|error:" -A3 build.log | head -30)
            [ -z "$msg" ] && msg=$(tail -30 build.log)
            msg=$(printf '%s' "$msg" | sed 's/%/%25/g' | awk '{printf "%s%%0A", $0}')
            echo "::error title=BUILD ERROR::$msg"
          fi
          exit $code
      - uses: actions/upload-artifact@v4
        with: { name: AuroraLauncher-APK, path: app/build/outputs/apk/debug/*.apk }
